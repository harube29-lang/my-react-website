<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4B2C20"/>
      <stop offset="100%" style="stop-color:#9C786C"/>
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.04"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- 배경 -->
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- 배경 원형 블러 효과 -->
  <circle cx="150" cy="100" r="180" fill="#6D4C41" opacity="0.4" filter="url(#blur)"/>
  <circle cx="680" cy="350" r="160" fill="#BCAAA4" opacity="0.25" filter="url(#blur)"/>

  <!-- 앱 목업 카드 (왼쪽) -->
  <rect x="60" y="90" width="200" height="280" rx="20" fill="url(#card1)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <!-- 피드 아이템 1 -->
  <rect x="76" y="106" width="168" height="90" rx="10" fill="rgba(255,255,255,0.1)"/>
  <circle cx="96" cy="126" r="14" fill="rgba(255,255,255,0.25)"/>
  <rect x="118" y="116" width="70" height="8" rx="4" fill="rgba(255,255,255,0.4)"/>
  <rect x="118" y="130" width="50" height="6" rx="3" fill="rgba(255,255,255,0.2)"/>
  <rect x="76" y="152" width="168" height="34" rx="6" fill="rgba(255,255,255,0.08)"/>
  <!-- 피드 아이템 2 -->
  <rect x="76" y="208" width="168" height="90" rx="10" fill="rgba(255,255,255,0.1)"/>
  <circle cx="96" cy="228" r="14" fill="rgba(255,255,255,0.25)"/>
  <rect x="118" y="218" width="60" height="8" rx="4" fill="rgba(255,255,255,0.4)"/>
  <rect x="118" y="232" width="45" height="6" rx="3" fill="rgba(255,255,255,0.2)"/>
  <rect x="76" y="254" width="168" height="34" rx="6" fill="rgba(255,255,255,0.08)"/>
  <!-- 하단 탭 바 -->
  <rect x="76" y="320" width="168" height="36" rx="8" fill="rgba(255,255,255,0.15)"/>
  <circle cx="110" cy="338" r="6" fill="rgba(255,255,255,0.7)"/>
  <circle cx="140" cy="338" r="6" fill="rgba(255,255,255,0.3)"/>
  <circle cx="170" cy="338" r="6" fill="rgba(255,255,255,0.3)"/>
  <circle cx="200" cy="338" r="6" fill="rgba(255,255,255,0.3)"/>
  <circle cx="228" cy="338" r="6" fill="rgba(255,255,255,0.3)"/>

  <!-- 중앙 로고 영역 -->
  <!-- 커피컵 아이콘 -->
  <g transform="translate(340, 120)">
    <!-- 커피컵 몸체 -->
    <path d="M30 20 L70 20 L62 80 L38 80 Z" fill="rgba(255,255,255,0.9)" rx="4"/>
    <!-- 손잡이 -->
    <path d="M70 32 Q90 32 90 50 Q90 68 70 68" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="5" stroke-linecap="round"/>
    <!-- 받침대 -->
    <rect x="22" y="80" width="56" height="8" rx="4" fill="rgba(255,255,255,0.7)"/>
    <!-- 스팀 -->
    <path d="M42 10 Q45 4 42 -2" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="3" stroke-linecap="round"/>
    <path d="M50 8 Q53 2 50 -4" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="3" stroke-linecap="round"/>
    <path d="M58 10 Q61 4 58 -2" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- 앱 이름 -->
  <text x="400" y="270" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">Cafe Notes</text>

  <!-- 서브타이틀 -->
  <text x="400" y="308" font-family="sans-serif" font-size="16" font-weight="400" fill="rgba(255,255,255,0.7)" text-anchor="middle" letter-spacing="1">Your cafe story, shared together</text>

  <!-- 태그 뱃지들 -->
  <rect x="300" y="328" width="72" height="26" rx="13" fill="rgba(255,255,255,0.15)"/>
  <text x="336" y="345" font-family="sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">React</text>

  <rect x="382" y="328" width="80" height="26" rx="13" fill="rgba(255,255,255,0.15)"/>
  <text x="422" y="345" font-family="sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">Supabase</text>

  <rect x="472" y="328" width="54" height="26" rx="13" fill="rgba(255,255,255,0.15)"/>
  <text x="499" y="345" font-family="sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">MUI</text>

  <!-- 오른쪽 통계 카드 -->
  <rect x="560" y="130" width="180" height="90" rx="16" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="650" y="168" font-family="sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle">❤️ SNS</text>
  <text x="650" y="196" font-family="sans-serif" font-size="13" fill="rgba(255,255,255,0.65)" text-anchor="middle">피드 · 팔로우 · 채팅</text>

  <rect x="560" y="240" width="180" height="90" rx="16" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="650" y="278" font-family="sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle">📸 피드</text>
  <text x="650" y="306" font-family="sans-serif" font-size="13" fill="rgba(255,255,255,0.65)" text-anchor="middle">게시물 · 좋아요 · 댓글</text>
</svg>
