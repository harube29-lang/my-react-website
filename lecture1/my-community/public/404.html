<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>ULSAN TastePick</title>
    <script>
      (function() {
        var l = window.location;
        var segments = l.pathname.split('/');
        // /my-react-website/portfolio/ 와 /my-react-website/my-0709/ 경로는 2세그먼트 유지
        var pathSegmentsToKeep = (segments[2] === 'portfolio' || segments[2] === 'my-0709') ? 2 : 1;
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          segments.slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>
